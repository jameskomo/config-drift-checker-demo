name: config-drift-checker
# Pinned track on push/PR to the setup; either track on demand. No schedule here on purpose — the
# product repo's own suite carries the scheduled canary — and .cdc.yml caps this repo at $3/month:
# the Action's gate refuses to start a run past that and says so in the job summary.
on:
  push:
    branches: [main]
    paths: ['CLAUDE.md', '.claude-plugin/**', '.cdc.yml', 'agent-config/**', 'src/**']
  pull_request:
    paths: ['CLAUDE.md', '.claude-plugin/**', '.cdc.yml', 'agent-config/**', 'src/**']
  workflow_dispatch:
    inputs:
      track:            { description: 'pinned | canary', default: 'pinned' }
      promote-baseline: { description: 'Overwrite baseline with this run (pinned track)', type: boolean, default: false }
      ablation:         { description: 'with-without | none', default: 'none' }
      force:            { description: 'Skip the budget gate', type: boolean, default: false }

permissions: { contents: write, pull-requests: write }
concurrency: { group: config-drift-checker, cancel-in-progress: false }

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Agent runs use the subscription token (`claude setup-token`): no API credit is spent. The API key
      # is deliberately NOT passed — if both are set the key wins and runs bill prepaid credit.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # continue-on-error: an exhausted/low API key must never turn into a red commit
      # status — that reads as "the product is broken" to anyone looking at the repo.
      # The step below still surfaces it loudly in the run's own summary and logs.
      - uses: jameskomo/config-drift-checker/action@v0
        id: eval
        continue-on-error: true
        with:
          plugin-dir: .                      # the repo root is the plugin (.claude-plugin/plugin.json)
          track: ${{ inputs.track || 'pinned' }}
          ablation: ${{ inputs.ablation || 'none' }}
          promote-baseline: ${{ inputs.promote-baseline || 'false' }}
          force: ${{ inputs.force || 'false' }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Surface a failed eval step without failing the pipeline
        if: always() && steps.eval.outcome == 'failure'
        run: |
          echo "### ⚠️ config-drift-checker eval step failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Often an exhausted/low ANTHROPIC_API_KEY balance, not a real regression. Check the step logs above, top up the key if needed, and re-run manually (Actions → config-drift-checker → Run workflow)." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::config-drift-checker eval step failed (see job summary for likely cause)."
